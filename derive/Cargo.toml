[package]
name = "bgpkit-snap-derive"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "MIT"
repository = "https://github.com/bgpkit/bgpkit-snap"
description = "The SnapValue derive for bgpkit-snap"
keywords = ["bgp", "prefix", "trie", "derive"]
categories = ["network-programming", "data-structures"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
