[package]
name = "snaptrie"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Versioned, memory-mappable container for prefix tries"

[dependencies]
prefix-trie = { version = "0.10", features = ["rkyv", "ipnet"] }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "aligned"] }
ipnet = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }

[[bin]]
name = "snap"
path = "src/bin/snap.rs"

[[bin]]
name = "gen-fixture"
path = "src/bin/gen_fixture.rs"
