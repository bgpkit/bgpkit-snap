[package]
name = "bgpkit-snap"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "MIT"
repository = "https://github.com/bgpkit/bgpkit-snap"
readme = "README.md"
description = "Versioned single-file container for prefix tries, with an append-only journal"
keywords = ["bgp", "prefix", "trie", "snapshot", "index"]
categories = ["network-programming", "data-structures", "filesystem"]
exclude = ["tests/downstream"]

[workspace]
members = ["derive"]
# the out-of-crate consumer is built with its own manifest, on purpose
exclude = ["tests/downstream"]

[features]
default = []
# The `snap` CLI. Library users never pay for clap.
cli = ["dep:clap"]
# `#[derive(SnapValue)]`. Off by default: it brings syn and quote into the build.
derive = ["dep:bgpkit-snap-derive"]

[dev-dependencies]
# the mutation suite reseals a mutated object so the reader reaches its archive checks
blake3 = "1"
crc32c = "0.6"

[dependencies]
prefix-trie = { version = "0.10", features = ["rkyv", "ipnet"] }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "aligned"] }
ipnet = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
crc32c = "0.6"
fs2 = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"], optional = true }
bgpkit-snap-derive = { version = "0.1.0", path = "derive", optional = true }

[[bin]]
# not `snap`: that name belongs to the Ubuntu package manager's client
name = "bgpkit-snap"
path = "src/bin/bgpkit-snap.rs"
required-features = ["cli"]

[profile.release]
debug = 1
