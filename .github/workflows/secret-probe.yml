name: secret probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report whether the publish token is visible
        run: |
          if [ -n "${{ secrets.CARGO_REGISTRY_TOKEN }}" ]; then
            echo "CARGO_REGISTRY_TOKEN: present"
          else
            echo "CARGO_REGISTRY_TOKEN: missing"
          fi
