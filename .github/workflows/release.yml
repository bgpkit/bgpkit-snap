name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - v[0-9]+.*

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run clippy
        run: cargo clippy --all-targets --features cli -- -D warnings
      - name: Run tests
        run: cargo test --features cli --verbose
      - name: Build the package tarball (the publish step verifies it)
        run: cargo package --no-verify

  cargo-publish:
    needs: build-test
    runs-on: ubuntu-latest
    outputs:
      already: ${{ steps.check.outputs.already }}
    steps:
      - uses: actions/checkout@v4
      # a tag whose publish succeeded but whose release step failed must be
      # retryable: publishing twice is not possible, so ask the registry first
      - name: Is this version already published?
        id: check
        run: |
          name=$(sed -n 's/^name = "\(.*\)"/\1/p' Cargo.toml | head -1)
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'User-Agent: bgpkit-release' \
            "https://crates.io/api/v1/crates/${name}/${version}")
          if [ "$code" = "200" ]; then
            echo "already=yes" >> "$GITHUB_OUTPUT"
            echo "${name} ${version} is already on the registry, skipping the publish"
          else
            echo "already=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Guard the secret
        if: steps.check.outputs.already == 'no'
        run: |
          if [ -z "${{ secrets.CARGO_REGISTRY_TOKEN }}" ]; then
            echo "CARGO_REGISTRY_TOKEN is not available to this repository" >&2
            exit 1
          fi
      - name: Publish to crates.io
        if: steps.check.outputs.already == 'no'
        run: >
          cargo publish
          --features cli
          --verbose
          --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  create-release:
    needs: cargo-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}
