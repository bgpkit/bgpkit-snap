name: Release

permissions:
  contents: write
  # the publish job asks whether ci passed for this commit before it publishes
  actions: read

on:
  push:
    tags:
      - v[0-9]+.*

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run clippy
        run: cargo clippy --all-targets --features cli,derive -- -D warnings
      - name: Run tests
        run: cargo test --features cli,derive --verbose
      # every check ci runs, because a tag can point at a commit ci never saw
      - name: Build every example
        run: cargo build --examples --features cli,derive
      - name: Build the out-of-crate consumer
        run: cargo test --manifest-path tests/downstream/Cargo.toml
      # the main crate depends on bgpkit-snap-derive by version, so its tarball cannot
      # be built until that crate is on the registry: `cargo publish` is where it gets
      # built for the first time, and a dry run here would only test the registry
      - name: Check the derive crate packages on its own
        run: cargo package --package bgpkit-snap-derive --no-verify
      - name: Check every manifest resolves
        run: cargo metadata --format-version 1 --no-deps > /dev/null

  cargo-publish:
    needs: build-test
    runs-on: ubuntu-latest
    outputs:
      already: ${{ steps.check.outputs.already }}
    steps:
      - uses: actions/checkout@v4
      # a tag can point at a commit that ci never ran or that failed it. publishing is
      # irreversible, so this refuses instead of assuming, and the message says what to do
      - name: Require ci to be green on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # ask for runs on this exact sha, then keep the ones from the ci workflow: this
          # job's own run is on the same sha and must not count as evidence
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=50" \
            --jq '[.workflow_runs[] | select(.name == "ci") | {status, conclusion}]' > /tmp/ci-runs.json
          python3 - <<'PY'
          import json, sys
          runs = json.load(open("/tmp/ci-runs.json"))
          if not runs:
              sys.exit("no ci run for this commit: push it to main and wait for ci before tagging")
          bad = [r for r in runs if r.get("status") != "completed" or r.get("conclusion") != "success"]
          if bad:
              sys.exit(f"ci is not green on this commit: {[(r.get('status'), r.get('conclusion')) for r in bad]}")
          print(f"ci green on {len(runs)} run(s) for this commit")
          PY
      # a tag whose publish succeeded but whose release step failed must be
      # retryable: publishing twice is not possible, so ask the registry first
      - name: Is this version already published?
        id: check
        run: |
          name=$(sed -n 's/^name = "\(.*\)"/\1/p' Cargo.toml | head -1)
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          url="https://crates.io/api/v1/crates/${name}/${version}"
          code=$(curl -s -o /tmp/crate.json -w '%{http_code}' -H 'User-Agent: bgpkit-release' "$url")
          case "$code" in
            404)
              echo "already=no" >> "$GITHUB_OUTPUT"
              echo "${name} ${version} is not on the registry yet"
              ;;
            200)
              # a retry must not attach a release to code the registry never received:
              # compare the published crate with the one this tag builds
              cargo package --no-verify --quiet
              local_sum=$(sha256sum "target/package/${name}-${version}.crate" | cut -d' ' -f1)
              published_sum=$(python3 -c 'import json;print(json.load(open("/tmp/crate.json"))["version"]["checksum"])')
              if [ "$local_sum" != "$published_sum" ]; then
                echo "the registry holds a different ${name} ${version} (registry ${published_sum}, this tag ${local_sum})" >&2
                exit 1
              fi
              echo "already=yes" >> "$GITHUB_OUTPUT"
              echo "${name} ${version} is already published with this content; skipping the publish"
              ;;
            *)
              echo "crates.io answered ${code} for ${url}; refusing to guess whether to publish" >&2
              exit 1
              ;;
          esac
      - name: Guard the secret
        if: steps.check.outputs.already == 'no'
        run: |
          if [ -z "${{ secrets.CARGO_REGISTRY_TOKEN }}" ]; then
            echo "CARGO_REGISTRY_TOKEN is not available to this repository" >&2
            exit 1
          fi
      # the crate depends on bgpkit-snap-derive by version, so it has to exist first
      - name: Publish bgpkit-snap-derive to crates.io
        if: steps.check.outputs.already == 'no'
        run: >
          cargo publish
          --package bgpkit-snap-derive
          --verbose
          --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for the registry to serve the derive crate
        if: steps.check.outputs.already == 'no'
        run: |
          derive_version=$(sed -n 's/^version = "\(.*\)"/\1/p' derive/Cargo.toml | head -1)
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'User-Agent: bgpkit-release' \
              "https://crates.io/api/v1/crates/bgpkit-snap-derive/${derive_version}")
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "bgpkit-snap-derive ${derive_version} is still not on the registry after five minutes" >&2
          exit 1
      - name: Publish to crates.io
        if: steps.check.outputs.already == 'no'
        run: >
          cargo publish
          --features cli
          --verbose
          --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  create-release:
    needs: cargo-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}
