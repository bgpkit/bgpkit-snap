name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - v[0-9]+.*

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run clippy
        run: cargo clippy --all-targets --features cli -- -D warnings
      - name: Run tests
        run: cargo test --features cli --verbose
      - name: Build the package tarball (the publish step verifies it)
        run: cargo package --no-verify

  cargo-publish:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard the secret
        run: |
          if [ -z "${{ secrets.CARGO_REGISTRY_TOKEN }}" ]; then
            echo "CARGO_REGISTRY_TOKEN is not available to this repository" >&2
            exit 1
          fi
      - name: Publish to crates.io
        run: >
          cargo publish
          --features cli
          --verbose
          --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  create-release:
    needs: cargo-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}
